<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2a38"/><stop offset="1" stop-color="#0b141c"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#bgD)"/><g transform="translate(20 22) scale(.92)">
 <title>EspSoup</title>
 <!-- Scooping one clean signal (green peak) out of the frequency soup (noisy spectrum); steam = rising waves -->
 <defs>
  <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8c42"/><stop offset="1" stop-color="#d9480f"/></linearGradient>
  <radialGradient id="soup" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffc861"/><stop offset="1" stop-color="#f08c00"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f9fa"/><stop offset="1" stop-color="#8f9ba6"/></linearGradient>
  <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4dabf7" stop-opacity=".9"/><stop offset="1" stop-color="#b197fc" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="soupClip"><ellipse cx="256" cy="286" rx="166" ry="30"/></clipPath>
 </defs>
 <g fill="none" stroke="url(#steam)" stroke-width="11" stroke-linecap="round">
